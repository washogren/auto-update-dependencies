name: End-to-end (action PR)

# On every push to a PR, dogfoods the action against the real am-dependency and
# am-consumer repos:
#   1. format / lint / typecheck / unit-test the PR
#   2. dispatch am-dependency's publish run — one whole major version, three
#      publishes, with the tier dist-tags pointed at them
#   3. dispatch am-consumer's five-tier e2e at the PR's HEAD SHA and wait
#   4. only if every tier passed, advance the major baseline so the NEXT run has
#      a real lower-major version to classify against
#   5. comment the outcome on the PR
#
# Step 4 is the crash-safety hinge. The major tier pins whatever
# e2e-major-baseline resolves to, and that tag moves only after a fully green
# run — so a failed or cancelled run leaves it pointing at the last known-good
# version instead of at a major that was never finished publishing.
#
# Concurrency is per-PR for cancel-in-progress (each push supersedes the
# previous run); the downstream workflows have their own serialized groups.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: end-to-end-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PACKAGE: '@washogren/am-dependency'
  REGISTRY: 'https://npm.pkg.github.com'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    # Skip fork PRs — they don't receive secrets, and we don't want to publish
    # on behalf of an unverified contributor anyway.
    #
    # Also skip Dependabot PRs, which run with the Dependabot secrets context and
    # therefore cannot see E2E_TOKEN. Mirroring the token into that scope would
    # expose it to any malicious dependency update. verify + check-dist +
    # super-linter + CodeQL still gate those; maintainers can run this manually
    # post-merge if a bump warrants it.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.E2E_TOKEN }}
      ACTION_PR_SHA: ${{ github.event.pull_request.head.sha }}
      ACTION_PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 20

      # --- am-dependency: publish one run's worth of versions ---
      - name: Dispatch the am-dependency publish run
        id: publish
        run: |
          START=$(date -u +%s)
          gh workflow run publish-run.yml -R washogren/am-dependency --ref master
          for _ in $(seq 1 30); do
            RUN_ID=$(gh run list -R washogren/am-dependency \
              --workflow publish-run.yml --limit 5 \
              --json databaseId,createdAt,event \
              --jq "[.[] | select(.event == \"workflow_dispatch\") | select((.createdAt | fromdateiso8601) >= $START)] | .[0].databaseId")
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              echo "run_url=https://github.com/washogren/am-dependency/actions/runs/$RUN_ID" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep 2
          done
          if [ -z "${RUN_ID:-}" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::could not locate the dispatched publish run" >&2
            exit 1
          fi
          echo "dispatched: https://github.com/washogren/am-dependency/actions/runs/$RUN_ID"

      - name: Wait for the publish run
        run: gh run watch -R washogren/am-dependency ${{ steps.publish.outputs.run_id }} --exit-status

      # --- am-consumer: run the five tiers against THIS PR's action code ---
      - name: Dispatch the am-consumer tiers at the PR SHA
        id: consumer
        run: |
          START=$(date -u +%s)
          gh workflow run end-to-end.yml -R washogren/am-consumer \
            --ref master --field action-ref="$ACTION_PR_SHA"
          for _ in $(seq 1 30); do
            RUN_ID=$(gh run list -R washogren/am-consumer \
              --workflow end-to-end.yml --limit 5 \
              --json databaseId,createdAt,event \
              --jq "[.[] | select(.event == \"workflow_dispatch\") | select((.createdAt | fromdateiso8601) >= $START)] | .[0].databaseId")
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              echo "run_url=https://github.com/washogren/am-consumer/actions/runs/$RUN_ID" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep 2
          done
          if [ -z "${RUN_ID:-}" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::could not locate the dispatched consumer run" >&2
            exit 1
          fi

      - name: Wait for the consumer tiers
        id: tiers
        run: gh run watch -R washogren/am-consumer ${{ steps.consumer.outputs.run_id }} --exit-status

      # --- only now, with every tier green, is the baseline safe to advance ---
      - name: Advance the major baseline
        env:
          NODE_AUTH_TOKEN: ${{ secrets.E2E_TOKEN }}
        run: |
          # Scope-bound only, never a global default. These keys are not valid
          # shell identifiers (`@`, `:`, `/`), so they go in .npmrc rather than
          # through `export`.
          printf '@washogren:registry=%s\n' "$REGISTRY" > .npmrc
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" >> .npmrc

          # e2e-patch points at this run's M.1.1 — read it rather than plumbing
          # the version across repos.
          LATEST=$(npm dist-tag ls "$PACKAGE" | sed -n 's/^e2e-patch: //p')
          [ -n "$LATEST" ] || { echo "::error::could not resolve e2e-patch" >&2; exit 1; }

          PREV=$(npm dist-tag ls "$PACKAGE" | sed -n 's/^e2e-major-baseline: //p')
          npm dist-tag add "$PACKAGE@$LATEST" e2e-major-baseline
          echo "e2e-major-baseline: ${PREV:-<unset>} -> $LATEST"
          echo "BASELINE_FROM=${PREV:-unset}" >> "$GITHUB_ENV"
          echo "BASELINE_TO=$LATEST" >> "$GITHUB_ENV"

      # Everything a reviewer needs to verify the run without opening it: a
      # pass/fail per tier, the step that failed when one did, and a deep link to
      # every PR and branch the run touched so the actual diffs are one click away.
      - name: Comment the outcome on the PR
        if: always()
        env:
          NODE_AUTH_TOKEN: ${{ secrets.E2E_TOKEN }}
          PUBLISH_URL: ${{ steps.publish.outputs.run_url }}
          PUBLISH_RESULT: ${{ steps.publish.outcome }}
          CONSUMER_URL: ${{ steps.consumer.outputs.run_url }}
          CONSUMER_RUN_ID: ${{ steps.consumer.outputs.run_id }}
          TIERS_RESULT: ${{ steps.tiers.outcome }}
          CONSUMER: washogren/am-consumer
          DEPENDENCY: washogren/am-dependency
        run: |
          # shellcheck disable=SC2016
          # The single-quoted jq filters and printf formats below contain literal
          # backticks — Markdown code spans in the rendered comment — which
          # shellcheck reads as command substitution. Non-expansion is the intent.
          set +e   # a reporting step must never be the reason a run fails

          # --- the version plan, so each row can show what it compared ---
          printf '@washogren:registry=%s\n' "$REGISTRY" > .npmrc
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" >> .npmrc
          TAGS=$(npm dist-tag ls "$PACKAGE" 2>/dev/null)
          LATEST=$(echo "$TAGS" | sed -n 's/^e2e-patch: //p')
          BASE=$(echo "$TAGS" | sed -n 's/^e2e-major-baseline: //p')
          M="${LATEST%%.*}"
          [ -n "$M" ] && { PATCH_BASE="${M}.1.0"; MINOR_BASE="${M}.0.0"; }

          # This step runs AFTER the baseline may have advanced, so the tag now
          # reads this run's version rather than what the major tier actually
          # compared against. BASELINE_FROM holds the pre-advance value and is
          # only set when the advance ran; when it was skipped the tag is still
          # the value the tier used.
          MAJOR_COMPARED="${BASELINE_FROM:-$BASE}"

          # --- per-tier job results from the consumer run ---
          JOBS='{}'
          if [ -n "$CONSUMER_RUN_ID" ]; then
            JOBS=$(gh run view "$CONSUMER_RUN_ID" -R "$CONSUMER" --json jobs 2>/dev/null || echo '{}')
          fi

          job_field() { # $1=job name, $2=jq expression over the job object
            echo "$JOBS" | jq -r --arg n "$1" "[.jobs[]? | select(.name==\$n)] | .[0] | $2 // \"\"" 2>/dev/null
          }
          icon() { case "$1" in success) echo "✅";; failure) echo "❌";; skipped) echo "⏭️";; "") echo "❔";; *) echo "⚠️";; esac; }

          # --- one row per tier ---
          row() { # $1=tier  $2=job name  $3=compare text  $4=expects a PR?
            local tier="$1" job="$2" compare="$3" expects_pr="$4"
            local concl failed pr_cell
            concl=$(job_field "$job" '.conclusion')
            failed=$(job_field "$job" '[.steps[]? | select(.conclusion=="failure") | .name] | first')

            pr_cell="—"
            local pr
            pr=$(gh pr list -R "$CONSUMER" --state all --limit 1 \
                   --head "auto-update/washogren-am-dependency-e2e-$tier" \
                   --json number,url,state --jq '.[0] | select(.number != null) | "[#\(.number)](\(.url)) `\(.state)`"' 2>/dev/null)
            if [ -n "$pr" ]; then
              pr_cell="$pr"
            elif [ "$expects_pr" = "no" ]; then
              pr_cell="_none — expected_"
            fi

            echo "| \`$tier\` | $(icon "$concl") ${concl:-unknown} | $compare | $pr_cell | ${failed:-—} |"
          }

          {
            echo "### End-to-end results"
            echo
            printf '**Action ref:** [`%s`](https://github.com/%s/commit/%s)' \
              "${ACTION_PR_SHA:0:7}" "$GITHUB_REPOSITORY" "$ACTION_PR_SHA"
            if [ -n "$M" ]; then
              printf ' · **Run major:** `%s` (published `%s` → `%s` → `%s`)' \
                "$M" "$MINOR_BASE" "$PATCH_BASE" "$LATEST"
            fi
            printf '\n'
            echo
            echo "| Tier | Result | Compared | Pull request | Failed at |"
            echo "| --- | --- | --- | --- | --- |"
            row patch    "tier (patch)"    "\`$PATCH_BASE\` → \`$LATEST\` (patch)"          yes
            row minor    "tier (minor)"    "\`$MINOR_BASE\` → \`$LATEST\` (minor)"          yes
            row update   "tier-update"     "\`$MINOR_BASE\` → \`$PATCH_BASE\` → \`$LATEST\`" yes
            row major    "tier (major)"    "\`$MAJOR_COMPARED\` → \`$LATEST\` (major)"      no
            row nochange "tier (nochange)" "\`$LATEST\` → \`$LATEST\` (none)"               no
            echo
            RESET_C=$(job_field "reset" '.conclusion')
            RESET_F=$(job_field "reset" '[.steps[]? | select(.conclusion=="failure") | .name] | first')
            echo "| Stage | Result | Log | Failed at |"
            echo "| --- | --- | --- | --- |"
            echo "| publish run | $(icon "$PUBLISH_RESULT") $PUBLISH_RESULT | [log](${PUBLISH_URL:-#}) | — |"
            echo "| reset + seed | $(icon "$RESET_C") ${RESET_C:-unknown} | [log](${CONSUMER_URL:-#}) | ${RESET_F:-—} |"
            echo "| tiers overall | $(icon "$TIERS_RESULT") $TIERS_RESULT | [log](${CONSUMER_URL:-#}) | — |"
            echo
            echo "<details><summary>Branches to review the diffs</summary>"
            echo
            for t in patch minor update major nochange; do
              echo "- [\`e2e/$t\`](https://github.com/$CONSUMER/tree/e2e/$t) · [seed diff](https://github.com/$CONSUMER/compare/master...e2e/$t)"
            done
            echo "- [\`$DEPENDENCY\` commits this run](https://github.com/$DEPENDENCY/commits/master)"
            echo
            echo "</details>"
            echo

            if [ "$TIERS_RESULT" = "success" ]; then
              echo "Major baseline advanced: \`${BASELINE_FROM:-unset}\` → \`${BASELINE_TO:-unchanged}\`"
            else
              echo "> [!WARNING]"
              echo "> A tier failed, so the major baseline was left untouched at \`${BASE:-unknown}\`."
              echo "> The next run classifies against that last known-good version, and Phase 0"
              echo "> clears this run's branches and PRs before it starts."
            fi
          } > comment.md

          cat comment.md
          gh pr comment "$ACTION_PR_NUMBER" -R "$GITHUB_REPOSITORY" --body-file comment.md
          exit 0
